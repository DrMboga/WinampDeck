# /etc/asound.conf for the Deck (ADR 0004, and Phase 12 for the tap).
#
# Both Engines play to "deck", through ALSA's plug layer (plug:deck), which
# converts whatever rate and format they play at. "deck" sends each stream to
# two mixers at once:
#   dmixer    the HAT, which the amplifier hears;
#   dmixloop  the kernel's loopback card, whose other end the controller
#             records for the spectrum analyzer.
# The loopback takes its timing from the HAT (snd-aloop's timer_source, in
# /etc/modprobe.d/snd-aloop.conf), so the two never drift apart. That needs
# both mixers on the same format and period: dmixloop pins the values dmixer
# runs at by default (S16_LE, 48000 Hz, period 6000, buffer 18000).
#
# Cards are named, never numbered: the HAT isn't always card 0.

pcm.hifiberry {
    type hw
    card sndrpihifiberry
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_key_add_uid false
    slave {
        pcm "hifiberry"
        channels 2
        rate 48000
    }
}

ctl.dmixer {
    type hw
    card sndrpihifiberry
}

pcm.dmixloop {
    type dmix
    ipc_key 1025
    ipc_key_add_uid false
    slave {
        pcm "hw:Loopback,0,0"
        format S16_LE
        channels 2
        rate 48000
        period_size 6000
        buffer_size 18000
    }
}

# Four channels in, two to each mixer.
pcm.deckmulti {
    type multi
    slaves.a { pcm "dmixer" channels 2 }
    slaves.b { pcm "dmixloop" channels 2 }
    bindings.0 { slave a channel 0 }
    bindings.1 { slave a channel 1 }
    bindings.2 { slave b channel 0 }
    bindings.3 { slave b channel 1 }
    master 0
}

# Stereo in, each channel copied to both mixers.
pcm.deck {
    type route
    slave { pcm "deckmulti" channels 4 }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}
